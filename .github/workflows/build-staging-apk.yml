name: Build staging APK

on:
  workflow_dispatch:
  push:
    branches:
      - develop-v5.1.3
      - "feature-*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: staging-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test staging APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install missing system dependencies
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            git
            curl
            unzip
            zip
          )

          missing=()

          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null \
              | grep -q "install ok installed"; then
              missing+=("$package")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Installing missing packages: ${missing[*]}"
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              "${missing[@]}"
          else
            echo "All required system packages are already installed."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install stable debug signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          # The secret is withheld from pull_request events raised from a
          # fork, so requiring it meant fork PRs could never compile - the
          # build died here before Gradle ran and the whole check was
          # unusable for review. Skip instead: app/build.gradle only wires
          # signingConfigs.ciDebug when CI_DEBUG_KEYSTORE is set and the
          # file exists, so an unset keystore degrades to Gradle's default
          # debug signing. The cost is that those APKs are not stably
          # signed, so they will not install over each other.
          if [ -z "${ANDROID_DEBUG_KEYSTORE_BASE64:-}" ]; then
            echo "::notice::ANDROID_DEBUG_KEYSTORE_BASE64 unavailable (expected for fork pull requests); using Gradle's default debug keystore. The APK still builds and tests, but is not stably signed."
            exit 0
          fi

          keystore="$RUNNER_TEMP/sentinel-ci-debug.keystore"

          # Strip whitespace before decoding: a secret pasted from a terminal
          # or an editor easily picks up wrapped newlines or a trailing CR,
          # and base64 --decode rejects a carriage return as invalid input.
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" \
            | tr -d '[:space:]' \
            | base64 --decode > "$keystore"

          chmod 600 "$keystore"

          keytool -list \
            -keystore "$keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          echo "CI_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Build staging debug APK
        run: ./gradlew --stacktrace :app:assembleStagingDebug

      - name: Run staging unit tests
        run: ./gradlew --stacktrace :app:testStagingDebugUnitTest

      - name: Collect APK and checksum
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          if [ -d app/build/outputs/apk/staging/debug ]; then
            find app/build/outputs/apk/staging/debug \
              -type f \
              -name "*.apk" \
              -exec cp {} artifacts/ \;
          fi

          if find artifacts -type f -name "*.apk" | grep -q .; then
            sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
            cat artifacts/SHA256SUMS.txt
          else
            echo "No staging debug APK was produced."
          fi

          for apk in artifacts/*.apk; do
            [ -e "$apk" ] || continue
            echo "Signing certificate for $apk:"
            keytool -printcert -jarfile "$apk" \
              | grep -E 'Owner:|SHA256:' || true
          done

      - name: Upload staging APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-staging-debug-${{ github.sha }}
          path: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14
