name: Build staging APK

on:
  workflow_dispatch:
  push:
    branches:
      - develop-v5.1.3
      - master
      - "feature-*"
      - tor-kmp-2x
    tags:
      - "v*"
    paths-ignore: 
      - "**.md"
      - "docs/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: staging-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test staging APK
    runs-on: ubuntu-26.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Guard - no Samourai endpoints or support addresses
        shell: bash
        run: |
          set -euo pipefail
          if grep -rEin 'samourai\.(io|com)|samouraiwallet\.com' app/src; then
            echo "::error::Samourai remnant detected - see #68"
            exit 1
          fi

      - name: Install missing system dependencies
        shell: bash
        run: |
          set -euo pipefail

          packages=(
            git
            curl
            unzip
            zip
          )

          missing=()

          for package in "${packages[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$package" 2>/dev/null \
              | grep -q "install ok installed"; then
              missing+=("$package")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Installing missing packages: ${missing[*]}"
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends \
              "${missing[@]}"
          else
            echo "All required system packages are already installed."
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;34.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install stable debug signing key
        shell: bash
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "ANDROID_DEBUG_KEYSTORE_BASE64 is not configured."
            exit 1
          fi

          keystore="$RUNNER_TEMP/sentinel-ci-debug.keystore"

          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" \
            | base64 --decode > "$keystore"

          chmod 600 "$keystore"

          keytool -list \
            -keystore "$keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          echo "CI_DEBUG_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Show build environment
        shell: bash
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version
          sdkmanager --list_installed

      - name: Build staging debug APK
        run: ./gradlew --stacktrace :app:assembleStagingDebug

      - name: Run staging unit tests
        run: ./gradlew --stacktrace :app:testStagingDebugUnitTest

      - name: Collect APK and checksum
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifacts

          if [ -d app/build/outputs/apk/staging/debug ]; then
            find app/build/outputs/apk/staging/debug \
              -type f \
              -name "*.apk" \
              -exec cp {} artifacts/ \;
          fi

          if find artifacts -type f -name "*.apk" | grep -q .; then
            (cd artifacts && sha256sum *.apk > SHA256SUMS.txt)
            cat artifacts/SHA256SUMS.txt
          else
            echo "No staging debug APK was produced."
          fi

          for apk in artifacts/*.apk; do
            [ -e "$apk" ] || continue
            echo "Signing certificate for $apk:"
            keytool -printcert -jarfile "$apk" \
              | grep -E 'Owner:|SHA256:' || true
          done

      - name: Upload staging APK
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-staging-debug-${{ github.sha }}
          path: |
            artifacts/*.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Upload unit-test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sentinel-test-results-${{ github.sha }}
          path: app/build/test-results/testStagingDebugUnitTest/*.xml
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish APK to GitHub Releases
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: sentinel-staging-debug-${{ github.sha }}
          path: release-assets

      - name: Verify checksum
        shell: bash
        run: |
          set -euo pipefail
          ls -l release-assets/
          cd release-assets
          sha256sum -c SHA256SUMS.txt
          # rename for the release page, then regenerate sums flat
          mv app-staging-debug.apk "sentinel-staging-${GITHUB_REF_NAME}.apk"
          sha256sum sentinel-staging-*.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release with APK + checksum
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.apk \
            release-assets/SHA256SUMS.txt \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
